[package]
name = "snn-editor"
version = "0.1.0"
description = "Agentic video editor"
authors = ["Sinan Isler"]
edition = "2021"

[workspace]
members = ["crates/snn-core"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snn_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
snn-core = { path = "crates/snn-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Calls to OpenRouter for the AI chat. Blocking HTTP, run on a background thread.
ureq = { version = "2", features = ["json"] }
# The OpenRouter key is kept in the operating system's credential store (Windows Credential Manager here).
keyring = { version = "3", features = ["windows-native"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
